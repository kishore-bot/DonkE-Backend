name: Verify DonkE

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - name: Install the Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
      - name: Install locked Python dependencies
        env:
          RUSTUP_TOOLCHAIN: "1.96.0"
        run: uv sync --locked --extra a2a
      - name: Static and engine checks
        env:
          RUSTUP_TOOLCHAIN: "1.96.0"
        run: |
          uv run ruff check .
          uv run ruff format --check app migrations scripts tests typings
          uv run --extra a2a pyright
          uv run python -m scripts.export_openapi --check
          uv run python -m scripts.export_asyncapi --check
          uv run python -m scripts.evaluate --check
          cargo fmt --all --manifest-path engine/Cargo.toml -- --check
          cargo test --locked --manifest-path engine/Cargo.toml
          cargo clippy --locked --manifest-path engine/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Start disposable integration stores
        run: |
          podman run -d --name donke-test-pg -p 127.0.0.1:55432:5432 -e POSTGRES_PASSWORD=synthetic docker.io/pgvector/pgvector:0.8.7-pg18
          podman run -d --name donke-test-redis -p 127.0.0.1:56379:6379 docker.io/library/redis:8-alpine
          timeout 45s sh -c 'until podman exec donke-test-pg pg_isready -h 127.0.0.1 -U postgres && podman exec donke-test-redis redis-cli ping; do sleep 1; done'
      - name: Verify the Alembic baseline
        env:
          DONKE_POSTGRES_DSN: postgresql+asyncpg://postgres:synthetic@127.0.0.1:55432/postgres
          DONKE_REDIS_DSN: redis://127.0.0.1:56379/0
          DONKE_AUTH_SECRET: synthetic-ci-key-with-at-least-32-bytes
        run: |
          uv run --locked alembic upgrade head
          uv run --locked alembic check
          uv run --locked alembic downgrade base
          uv run --locked alembic upgrade head
      - name: API and integration tests
        env:
          TEST_POSTGRES_DSN: postgresql+asyncpg://postgres:synthetic@127.0.0.1:55432/postgres
          TEST_REDIS_DSN: redis://127.0.0.1:56379/0
        run: uv run --extra a2a pytest -q
  podman-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DONKE_POSTGRES_PASSWORD: synthetic-showcase-only
      DONKE_AUTH_SECRET: synthetic-showcase-key-with-at-least-32-bytes
      DONKE_OBJECTS_ACCESS_KEY: donke-smoke
      DONKE_OBJECTS_SECRET_KEY: synthetic-showcase-storage-key
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - name: Install the Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Install the Podman Compose provider
        run: |
          uv tool install podman-compose==1.5.0
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Build and smoke-test the Podman stack
        env:
          DONKE_DEMO_MODE: "true"
          DONKE_ROOM_START_SECONDS: "0"
          RUSTUP_TOOLCHAIN: "1.96.0"
        run: |
          bash scripts/podman-dev.sh up
          bash scripts/podman-dev.sh smoke
      - name: Stop the Podman smoke stack
        if: always()
        run: |
          if command -v podman-compose >/dev/null; then
            bash scripts/podman-dev.sh down
          fi
