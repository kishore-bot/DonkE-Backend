x-backend: &backend
  image: localhost/donke-backend:dev
  pull_policy: never
  environment:
    DONKE_POSTGRES_DSN: postgresql+asyncpg://donke:${DONKE_POSTGRES_PASSWORD:?Set DONKE_POSTGRES_PASSWORD}@postgres:5432/donke
    DONKE_REDIS_DSN: redis://redis:6379/0
    DONKE_AUTH_SECRET: ${DONKE_AUTH_SECRET:?Set DONKE_AUTH_SECRET}
    DONKE_DEMO_MODE: ${DONKE_DEMO_MODE:-false}
    DONKE_GOOGLE_CLIENT_ID: ${DONKE_GOOGLE_CLIENT_ID:-}
    DONKE_BOT_FILL_SECONDS: ${DONKE_BOT_FILL_SECONDS:-10}
    DONKE_PRACTICE_SESSION_TTL_SECONDS: ${DONKE_PRACTICE_SESSION_TTL_SECONDS:-3600}
    DONKE_PRACTICE_MAX_SESSIONS: ${DONKE_PRACTICE_MAX_SESSIONS:-128}
    DONKE_REDIS_PREFIX: ${DONKE_REDIS_PREFIX:-donke}
    DONKE_ACCESS_SECONDS: ${DONKE_ACCESS_SECONDS:-1800}
    DONKE_REFRESH_SECONDS: ${DONKE_REFRESH_SECONDS:-604800}
    DONKE_REFRESH_REUSE_GRACE_SECONDS: ${DONKE_REFRESH_REUSE_GRACE_SECONDS:-20}
    DONKE_ADMIN_SESSION_SECONDS: ${DONKE_ADMIN_SESSION_SECONDS:-900}
    DONKE_ROOM_TTL_SECONDS: ${DONKE_ROOM_TTL_SECONDS:-3600}
    DONKE_QUEUE_TTL_SECONDS: ${DONKE_QUEUE_TTL_SECONDS:-120}
    DONKE_CLAIM_LEASE_SECONDS: ${DONKE_CLAIM_LEASE_SECONDS:-5}
    DONKE_MATCHMAKING_POLL_SECONDS: ${DONKE_MATCHMAKING_POLL_SECONDS:-0.25}
    DONKE_ROOM_START_SECONDS: ${DONKE_ROOM_START_SECONDS:-20}
    DONKE_MATCH_ACCEPT_SECONDS: ${DONKE_MATCH_ACCEPT_SECONDS:-20}
    DONKE_HAND_PREP_SECONDS: ${DONKE_HAND_PREP_SECONDS:-20}
    DONKE_TURN_SECONDS: ${DONKE_TURN_SECONDS:-45}
    DONKE_BOT_TURN_SECONDS: ${DONKE_BOT_TURN_SECONDS:-1.5}
    DONKE_MATCH_MINUTES: ${DONKE_MATCH_MINUTES:-45}
    DONKE_MATCH_ARCHIVE_SECONDS: ${DONKE_MATCH_ARCHIVE_SECONDS:-86400}
    DONKE_AI_PROVIDER: ${DONKE_AI_PROVIDER:-gemini}
    DONKE_STORAGE_PROVIDER: ${DONKE_STORAGE_PROVIDER:-s3}
    DONKE_GEMINI_API_KEY: ${DONKE_GEMINI_API_KEY:-}
    # Defaults use the local "objects" store. Set these to use a hosted bucket.
    DONKE_SEASON_MEDIA_BUCKET: ${DONKE_SEASON_MEDIA_BUCKET:-donke-season-media}
    DONKE_SEASON_MEDIA_ENDPOINT: ${DONKE_SEASON_MEDIA_ENDPOINT:-http://objects:9000}
    DONKE_SEASON_MEDIA_PUBLIC_ENDPOINT: ${DONKE_SEASON_MEDIA_PUBLIC_ENDPOINT:-http://localhost:9000}
    DONKE_SEASON_MEDIA_REGION: ${DONKE_SEASON_MEDIA_REGION:-us-east-1}
    DONKE_SEASON_MEDIA_CORS_ORIGINS: ${DONKE_SEASON_MEDIA_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-${DONKE_OBJECTS_ACCESS_KEY:-}}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-${DONKE_OBJECTS_SECRET_KEY:-}}
    AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    DONKE_GEMINI_TEXT_MODEL: ${DONKE_GEMINI_TEXT_MODEL:-gemini-3.8-flash}
    DONKE_GEMINI_VOICE_MODEL: ${DONKE_GEMINI_VOICE_MODEL:-gemini-3.8-flash-tts}
    DONKE_GEMINI_EMBEDDING_MODEL: ${DONKE_GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
    DONKE_AI_TEXT_DAILY_CALLS: ${DONKE_AI_TEXT_DAILY_CALLS:-250}
    DONKE_AI_VOICE_DAILY_CALLS: ${DONKE_AI_VOICE_DAILY_CALLS:-100}
    DONKE_VOICE_CONCURRENCY: ${DONKE_VOICE_CONCURRENCY:-2}
    DONKE_PUBLIC_BASE_URL: ${DONKE_PUBLIC_BASE_URL:-}
    DONKE_ADMIN_TOTP_KEY: ${DONKE_ADMIN_TOTP_KEY:-}

services:
  postgres:
    image: docker.io/pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_USER: donke
      POSTGRES_DB: donke
      POSTGRES_PASSWORD: ${DONKE_POSTGRES_PASSWORD:?Set DONKE_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "donke", "-d", "donke"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: docker.io/library/redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
  objects:
    # S3-compatible store for season media, replacing the hosted bucket locally.
    image: docker.io/rustfs/rustfs:1.0.7
    environment:
      RUSTFS_ACCESS_KEY: ${DONKE_OBJECTS_ACCESS_KEY:?Set DONKE_OBJECTS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${DONKE_OBJECTS_SECRET_KEY:?Set DONKE_OBJECTS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - objects-data:/data
    ports:
      # Browsers fetch signed media URLs from this address.
      - "127.0.0.1:9000:9000"
  objects-init:
    <<: *backend
    command: ["python", "-m", "scripts.init_object_storage"]
    depends_on:
      - objects
  db-init:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  app:
    <<: *backend
    build:
      context: .
      dockerfile: Containerfile
    entrypoint: ["python", "-m", "scripts.wait_for_storage"]
    command: ["granian", "--interface", "asgi", "--host", "0.0.0.0", "app.main:app"]
    ports:
      - "0.0.0.0:8000:8000"
    depends_on: &online-dependencies
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  matchmaking:
    <<: *backend
    entrypoint: ["python", "-m", "scripts.wait_for_storage"]
    command: ["python", "-m", "app.workers.matchmaking"]
    depends_on: *online-dependencies
    restart: unless-stopped
  jobs:
    <<: *backend
    entrypoint: ["python", "-m", "scripts.wait_for_storage"]
    command: ["taskiq", "worker", "app.workers.jobs:broker", "--workers", "1"]
    depends_on: *online-dependencies
    restart: unless-stopped
  scheduler:
    # Exactly one scheduler, or scheduled jobs would be kicked twice.
    <<: *backend
    entrypoint: ["python", "-m", "scripts.wait_for_storage"]
    command: ["taskiq", "scheduler", "app.workers.jobs:scheduler"]
    depends_on: *online-dependencies
    restart: unless-stopped
  voice:
    <<: *backend
    entrypoint: ["python", "-m", "scripts.wait_for_storage"]
    command: ["python", "-m", "app.workers.voice"]
    depends_on: *online-dependencies
volumes:
  postgres-data:
  redis-data:
  objects-data:
