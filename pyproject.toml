[project]
name = "donke-backend"
version = "0.3.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "donke-engine",
    "fastapi==0.165.0",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "granian>=2.8,<3",
    "alembic>=1.16,<2",
    "anyio>=4,<5",
    "argon2-cffi>=25,<26",
    "asyncpg>=0.31,<1",
    "google-auth[requests]>=2.40,<3",
    "google-genai>=2.27,<3",
    "mcp>=2,<3",
    "pydantic-ai-slim[google]>=2,<3",
    "pyjwt>=2.10,<3",
    "redis>=6,<9",
    "requests>=2.32,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "taskiq>=0.11",
    "taskiq-redis>=1.0",
    "cryptography>=46,<51",
    "langgraph>=1.0,<2",
]

[project.optional-dependencies]
a2a = ["a2a-sdk[http-server,sqlite]>=1.3.1,<2"]

[dependency-groups]
dev = ["httpx2", "pyright[nodejs]>=1.1,<2", "pytest>=9,<10", "ruff>=0.9,<1", "websockets>=17,<18"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["engine/py"]

[tool.uv.sources]
donke-engine = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: uses disposable PostgreSQL and Redis servers"]
# Deprecations raised by our own code fail the build instead of piling up.
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.pyright]
include = ["app"]
stubPath = "typings"
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "basic"

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["engine/target"]

[tool.ruff.lint]
# Pinned explicitly so every ruff version checks the same things.
# UP flags deprecated syntax and imports; ASYNC, B, DTZ and TRY catch the
# bugs that matter most in an async FastAPI service.
select = [
  "F", "E4", "E7", "E9", "W", "UP", "B", "SIM", "RUF", "C4", "PIE", "PERF",
  "FURB", "ASYNC", "DTZ", "TRY", "LOG", "G", "PT", "PTH", "PYI", "TC", "FA",
  "S", "T10", "T20", "EXE", "INT", "YTT", "PLE", "PLW", "PLC", "PLR",
]
ignore = [
  "PLR09",    # complexity counts: reviewed by hand, not by thresholds
  "PLR2004",  # magic numbers: game rules are numbers
  "TRY003",   # long messages in AppError are the user-facing text
  "S101",     # assert is used for invariants and in tests
  "T201",     # print is the interface of CLI scripts
  "TC001",    # FastAPI and Pydantic read annotations at runtime, so
  "TC002",    # moving imports under TYPE_CHECKING would break them
  "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "PT011", "PT018", "PLC0415"]
# Google SDKs load only when a Gemini key is configured.
"app/modules/ai/provider.py" = ["PLC0415"]
"scripts/**" = ["S603", "S607"]
"migrations/**" = ["E501"]
